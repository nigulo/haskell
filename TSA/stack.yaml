# --- Windows/GTK4 toolchain (S-7282, 2026-09-12) ---------------------------
# Same note as GUI/stack.yaml: stack 3.11.1 rejects `env:` / `extra-path-dirs:`
# at project level, so the GIR / pkg-config / DLL environment comes from the
# wrapper TSA\build.cmd. Build with:  cmd /c C:\github\haskell\TSA\build.cmd
extra-include-dirs:
  - C:/msys64/mingw64/include
extra-lib-dirs:
  - C:/msys64/mingw64/lib