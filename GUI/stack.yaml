# --- Windows/GTK4 toolchain (S-7282, 2026-09-12) ---------------------------
# NOTE: this project builds with Stack 3.11.1, which REJECTS the `env:` and
# `extra-path-dirs:` keys at project level ("Unrecognized fields in
# ProjectAndConfigMonoid: env, extra-path-dirs" - verified empirically), so
# the GIR / pkg-config / DLL environment CANNOT be configured from this file.
# It is instead provided by the wrapper script GUI\build.cmd, which sets:
#   XDG_DATA_DIRS=C:/msys64/mingw64/share
#   HASKELL_GI_GIR_SEARCH_PATH=C:/msys64/mingw64/share/gir-1.0
#       haskell-gi 0.26.17 GIR lookup (lib/Data/GI/GIR/Repository.hs searches
#       this var first, then getSystemDataDirs/XDG_DATA_DIRS, then a macOS
#       fallback). The machine-level XDG_DATA_DIRS is contaminated with the
#       literal string "set XDG_DATA_DIRS=C:/msys64/mingw64/share;C:/msys64/
#       usr/shareCopied!   " (cmd double-paste + clipboard artifact) and
#       should also be repaired by the user at system level.
#   PKG_CONFIG_PATH=C:\msys64\mingw64\lib\pkgconfig;...
#       stack's bundled msys2 has NO gtk4/pango/gdk-pixbuf .pc files, so all
#       .pc resolution must come from C:/msys64 (the tree cabal uses).
# and prepends C:\msys64\mingw64\bin to PATH so the C:/msys64 DLLs
# (libcairo-gobject-2.dll etc.) load ahead of stack's bundled msys2 DLLs
# during haskell-gi Setup.exe typelib loading, reproducing the DLL layout
# under which cabal builds the same gi-* packages successfully.
# Build with:  cmd /c C:\github\haskell\GUI\build.cmd
extra-include-dirs:
  - C:/msys64/mingw64/include
extra-lib-dirs:
  - C:/msys64/mingw64/lib
#
# Allow a newer minor version of GHC than the snapshot specifies
# compiler-check: newer-minor
